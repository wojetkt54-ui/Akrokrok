<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road to 7 Tricks</title>
  <style>
    :root{
      --bg:#0b0d11;
      --text:#f4f7fb;
      --shadow:0 18px 40px rgba(0,0,0,.28);
      --radius:22px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(103,83,163,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(49,106,92,.18), transparent 24%),
        linear-gradient(180deg, #090b0f 0%, #10141a 55%, #0c1015 100%);
      -webkit-font-smoothing:antialiased;
    }

    .wrap{
      width:min(980px, calc(100% - 28px));
      margin:0 auto;
      padding:28px 0 70px;
    }

    .header{
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:20px;
      padding:4px 0 6px;
    }

    h1{
      margin:0;
      text-align:center;
      font-size:clamp(30px, 7vw, 50px);
      line-height:1;
      letter-spacing:-.045em;
      background:linear-gradient(90deg, #ffffff 0%, #d8e0ef 30%, #c5d4c9 56%, #d8cdf0 82%, #ffffff 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .list{
      display:grid;
      gap:14px;
    }

    .trick{
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.08);
      transition:transform .22s ease, border-color .22s ease;
    }

    .trick:hover{ transform:translateY(-1px); }

    .trick-head{
      width:100%;
      border:0;
      color:inherit;
      padding:18px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 104px 46px;
      gap:14px;
      align-items:center;
      text-align:left;
      cursor:pointer;
      background:transparent;
    }

    .trick-main{min-width:0}

    .title-row{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }

    .trick h2{
      margin:0;
      font-size:23px;
      line-height:1.05;
      letter-spacing:-.02em;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:58px;
      padding:7px 10px;
      border-radius:12px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.04em;
      color:#eff5fb;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.15);
    }

    .mini{
      margin-top:12px;
      display:flex;
      align-items:center;
      gap:12px;
      color:rgba(255,255,255,.78);
      font-size:13px;
      font-weight:700;
    }

    .mini-bar{
      height:8px;
      flex:1;
      max-width:250px;
      background:rgba(255,255,255,.12);
      border-radius:999px;
      overflow:hidden;
    }

    .mini-bar i{
      display:block;
      height:100%;
      border-radius:999px;
      width:0;
      transition:width .26s ease;
      background:linear-gradient(90deg, rgba(255,255,255,.72), rgba(255,255,255,.96));
    }

    .art-box{
      width:104px;
      height:104px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.08);
      display:grid;
      place-items:center;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
      padding:5px;
    }

    .art-box svg{
      width:100%;
      height:100%;
      display:block;
    }

    .art-box img{
      width:72%;
      height:72%;
      object-fit:contain;
      display:block;
      image-rendering:auto;
      filter:contrast(1.10) brightness(1.04) drop-shadow(0 0 1px rgba(255,255,255,.18));
      transform:translateZ(0);
    }
.chev{
      width:46px;
      height:46px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      color:#eef3fa;
      flex-shrink:0;
      transition:transform .25s ease, background .25s ease;
    }

    .chev svg{
      width:18px;
      height:18px;
      transform:translateY(1px);
    }

    .trick.open .chev{
      transform:rotate(180deg);
      background:rgba(255,255,255,.13);
    }

    .stages{
      display:none;
      padding:10px;
      border-top:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
    }
    .trick.open .stages{display:block}

    .stage{
      border-radius:18px;
      padding:15px 14px;
      margin:10px 0;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.06);
    }

    .stage.done{
      border-color:rgba(255,255,255,.16);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
    }

    .stage-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
    }

    .stage-title strong{
      font-size:16px;
      line-height:1.3;
    }

    .stage-score{
      color:#eef3fa;
      font-size:12px;
      font-weight:850;
      padding:7px 9px;
      border-radius:11px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      white-space:nowrap;
    }

    label.item{
      display:grid;
      grid-template-columns:26px 1fr;
      gap:10px;
      align-items:flex-start;
      padding:8px 2px;
      cursor:pointer;
      color:#eef3fa;
      font-size:14px;
      line-height:1.45;
    }

    input[type="checkbox"]{
      appearance:none;
      width:22px;
      height:22px;
      border-radius:7px;
      margin:0;
      border:2px solid rgba(255,255,255,.34);
      background:rgba(10,12,16,.35);
      display:grid;
      place-content:center;
      cursor:pointer;
      transition:all .18s ease;
    }

    input[type="checkbox"]:checked{
      background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(223,231,242,.88));
      border-color:transparent;
    }

    input[type="checkbox"]:checked::after{
      content:"✓";
      color:#0d1420;
      font-size:15px;
      font-weight:950;
      line-height:1;
    }

    label.item:has(input:checked) span{
      color:rgba(240,245,251,.82);
      text-decoration:line-through;
      text-decoration-thickness:1px;
    }

    /* Color themes */
    .theme-navy{
      background:linear-gradient(180deg, rgba(24,42,73,.98), rgba(20,34,60,.98));
      border-color:rgba(115,161,235,.28);
    }
    .theme-navy:hover{border-color:rgba(126,175,245,.48)}
    .theme-navy .stages{background:rgba(15,29,52,.48)}
    .theme-navy .stage{background:linear-gradient(180deg, rgba(50,76,120,.44), rgba(39,61,98,.36))}
    .theme-navy .art-box{background:linear-gradient(180deg, rgba(82,114,171,.24), rgba(52,72,112,.18));}

    .theme-green{
      background:linear-gradient(180deg, rgba(21,62,51,.98), rgba(18,50,42,.98));
      border-color:rgba(99,199,160,.28);
    }
    .theme-green:hover{border-color:rgba(111,214,174,.48)}
    .theme-green .stages{background:rgba(13,39,33,.48)}
    .theme-green .stage{background:linear-gradient(180deg, rgba(47,104,88,.44), rgba(37,82,70,.36))}
    .theme-green .art-box{background:linear-gradient(180deg, rgba(77,146,120,.24), rgba(48,95,79,.18));}

    .theme-purple{
      background:linear-gradient(180deg, rgba(56,39,88,.98), rgba(44,31,72,.98));
      border-color:rgba(179,143,240,.30);
    }
    .theme-purple:hover{border-color:rgba(194,157,255,.50)}
    .theme-purple .stages{background:rgba(34,24,56,.48)}
    .theme-purple .stage{background:linear-gradient(180deg, rgba(89,65,132,.44), rgba(70,51,107,.36))}
    .theme-purple .art-box{background:linear-gradient(180deg, rgba(124,96,177,.24), rgba(79,58,119,.18));}

    .theme-orange{
      background:linear-gradient(180deg, rgba(82,48,27,.98), rgba(66,38,22,.98));
      border-color:rgba(230,159,103,.30);
    }
    .theme-orange:hover{border-color:rgba(242,173,117,.50)}
    .theme-orange .stages{background:rgba(52,29,17,.48)}
    .theme-orange .stage{background:linear-gradient(180deg, rgba(112,70,43,.44), rgba(88,54,34,.36))}
    .theme-orange .art-box{background:linear-gradient(180deg, rgba(166,105,67,.24), rgba(111,67,41,.18));}
@media (max-width:780px){
      .trick-head{
        grid-template-columns:minmax(0,1fr) 82px 42px;
        gap:12px;
      }
      .art-box{width:82px;height:82px;border-radius:16px;padding:4px}
    }

    @media (max-width:680px){
      .wrap{width:min(100% - 18px, 980px)}
      .trick-head{padding:16px}
      .trick h2{font-size:21px}
      .chev{width:42px;height:42px;border-radius:14px}
    }

    @media (max-width:520px){
      .trick-head{
        grid-template-columns:minmax(0,1fr) 70px 40px;
        gap:10px;
      }
      .art-box{width:70px;height:70px;border-radius:14px;padding:3px}
      .title-row{gap:8px}
      .badge{min-width:52px;padding:6px 8px;font-size:11px}
      .mini{font-size:12px}
    }
.art-box img.sideflip-img,
    .art-box img.gainer-img,
    .art-box img.webster-img,
    .art-box img.front-handspring-img,
    .art-box img.back-handspring-img,
.art-box img.gainer-img,
    .art-box img.webster-img,
    .art-box img.front-handspring-img,
    .art-box img.back-handspring-img,
.art-box img.sideflip-img{
      width:68%;

      object-position:center;
      transform:none;
    }

    .art-box img.gainer-img,

    .art-box img.front-handspring-img{

    }

    /* FINAL Front Handspring override */
    .art-box img.front-handspring-img{
      width:70% !important;

      <h1>Road to 7 Tricks</h1>
    </div>

    <main class="list" id="app"></main>

    function render(){
      const app = document.getElementById("app");
      app.innerHTML = "";

      DATA.forEach((trick, ti) => {
        const allIds = [];
        trick.stages.forEach((s, si) => s[1].forEach((_, ii) => allIds.push(idFor(ti, si, ii))));
        const done = allIds.filter(id => state[id]).length;
        const pct = Math.round(done / allIds.length * 100);
        const theme = THEMES[ti % THEMES.length];

        const card = document.createElement("section");
        card.className = `trick ${theme}`;
        if(state[`open-${ti}`]) card.classList.add("open");

        card.innerHTML = `
          <button class="trick-head" type="button">
            <div class="trick-main">
              <div class="title-row">
                <h2>${trick.name}</h2>
                <span class="badge">${done}/${allIds.length}</span>
              </div>
              <div class="mini">
                <div class="mini-bar"><i style="width:${pct}%"></i></div>
                <span>${pct}%</span>
              </div>
            </div>
            <div class="art-box">${artMarkup(trick.art)}</div>
            <div class="chev" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M6.5 9.5L12 15L17.5 9.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </button>
          <div class="stages"></div>
        `;

        card.querySelector(".trick-head").onclick = () => {
          state[`open-${ti}`] = !state[`open-${ti}`];
          save();
          render();
        };

        const stagesEl = card.querySelector(".stages");

        trick.stages.forEach((stage, si) => {
          const ids = stage[1].map((_, ii) => idFor(ti, si, ii));
          const sdone = ids.filter(id => state[id]).length;

          const stageEl = document.createElement("div");
          stageEl.className = "stage" + (sdone === ids.length ? " done" : "");
          stageEl.innerHTML = `
            <div class="stage-title">
              <strong>${stage[0]}</strong>
              <span class="stage-score">${sdone}/${ids.length}</span>
            </div>
          `;

          stage[1].forEach((txt, ii) => {
            const id = idFor(ti, si, ii);
            const label = document.createElement("label");
            label.className = "item";
            label.innerHTML = `
              <input type="checkbox" ${state[id] ? "checked" : ""}>
              <span>${txt}</span>
            `;
            label.querySelector("input").onchange = (e) => {
              state[id] = e.target.checked;
              save();
              render();
            };
            stageEl.appendChild(label);
          });

          stagesEl.appendChild(stageEl);
        });

        app.appendChild(card);
      });
    }

    function save(){
      try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
    }

    render();
  </script>
